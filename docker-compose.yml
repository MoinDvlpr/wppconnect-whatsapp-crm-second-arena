services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      WPP_SESSIONS_PATH: /app/data/wppconnect
      MEDIA_STORAGE_PATH: /app/data/media
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - appdata:/app/data # WPPConnect auth tokens + media (persistent)
    shm_size: "1gb" # Chromium needs shared memory
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  appdata:
